<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganga Aarti Varanasi - Divine Ceremony</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand" id="nav-brand"></div>
            <ul class="nav-links" id="nav-links"></ul>
            <div class="nav-actions">
                <button class="sound-btn" id="sound-toggle" aria-label="Disable background music" title="Disable music">🎵</button>
                <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <video class="hero-video" autoplay muted loop playsinline preload="metadata" id="hero-video">
            Your browser does not support the video tag.
        </video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 id="hero-title"></h1>
            <p id="hero-subtitle"></p>
            <p class="tagline" id="hero-tagline"></p>
        </div>
    </section>

    <!-- About Section -->
    <section id="about" class="about">
        <div class="container">
            <h2 id="about-heading"></h2>
            <p id="about-description"></p>
            <div class="features" id="features-container"></div>

            <div class="services-section">
                <h3 id="services-heading"></h3>
                <ul class="services-list" id="services-list"></ul>
            </div>
        </div>
    </section>

    <!-- Offerings Section -->
    <section id="offerings" class="offerings">
        <div class="container">
            <h2 id="offerings-heading"></h2>
            <p class="section-intro" id="offerings-intro"></p>
            
            <div class="offerings-wrapper">
                <div class="offerings-image">
                    <img id="offering-photo" class="offering-photo" alt="">
                </div>
                
                <div class="offerings-content">
                    <div class="pricing-table">
                        <table>
                    <thead>
                        <tr id="offerings-columns"></tr>
                    </thead>
                    <tbody id="offerings-tbody"></tbody>
                </table>
                    </div>
                </div>
            </div>

            <div class="offering-info">
                <p id="offerings-note"></p>
            </div>
        </div>
    </section>

    <!-- Instagram Feed Section -->
    <section class="instagram-section" id="instagram">
        <div class="container">
            <h2 id="instagram-heading"></h2>
            <p class="section-intro" id="instagram-intro"></p>

            <div class="instagram-grid" id="instagram-grid"></div>

            <div class="instagram-cta">
                <a class="insta-follow-btn" id="instagram-follow-link" target="_blank" rel="noopener"></a>
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact">
        <div class="container">
            <h2 id="contact-heading"></h2>
            <p class="section-intro" id="contact-intro"></p>
            
            <div class="contact-content">
                <div class="contact-info">
                    <h3>Contact Us</h3>
                    <p class="contact-person" id="contact-person"></p>
                    <p id="contact-address"></p>
                    <p id="contact-phone"></p>
                    <p id="contact-email"></p>
                    <p class="contact-note" id="contact-note"></p>
                </div>

                <div class="contact-form">
                    <div class="email-button-container">
                        <button class="whatsapp-btn" onclick="openWhatsApp()">💬 Chat on WhatsApp</button>
                    </div>
                    <div class="social-links">
                        <p>Follow us on Instagram:</p>
                        <a id="contact-social-link" target="_blank" class="social-btn"></a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p id="footer-line1"></p>
            <p id="footer-line2"></p>
        </div>
    </footer>

    <!-- Floating action buttons (WhatsApp / Instagram) -->
    <div class="floating-actions" id="floating-actions"></div>

    <script src="script.js"></script>
</body>
</html>
